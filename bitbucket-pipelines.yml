pipelines:
  branches:
    develop:
      - step:
          name: Trigger yocto validation
          script:
            - |
              export USER_NAME=$(git show -s --format="%an <%ae>" "$BITBUCKET_COMMIT")
              export MERGE_MESSAGE=$(git log --format=%B -n 1 "$BITBUCKET_COMMIT")
              echo "Author: $USER_NAME"
              echo "Message: $MERGE_MESSAGE"

              # Check the FULL message, before any truncation
              if [[ "$MERGE_MESSAGE" == *"[NO_UPDATE_REV]"* ]]; then
                echo "The string [NO_UPDATE_REV] is present. Skipping trigger."
                exit 0
              fi

              # Flatten newlines/tabs to spaces, drop chars that break JSON,
              # then cap the length to keep the trigger payload under 10240 bytes.
              export SAFE_MESSAGE=$(printf '%s' "$MERGE_MESSAGE" \
                | tr '\n\r\t' '   ' \
                | tr -d '\\"' \
                | cut -c1-1500)
              echo "SAFE_MESSAGE bytes: $(printf '%s' "$SAFE_MESSAGE" | wc -c)"
            - pipe: atlassian/trigger-pipeline:5.10.1
              variables:
                BITBUCKET_ACCESS_TOKEN: $HAILO_YOCTO_VALIDATION_TOKEN_2026
                REPOSITORY: 'hailo-yocto-validation'
                REF_NAME: 'develop'
                CUSTOM_PIPELINE_NAME: 'update_vpu_revisions_pipeline'
                PIPELINE_VARIABLES: >
                  [{"key": "USERNAME", "value": "$USER_NAME"},
                   {"key": "MERGE_MESSAGE", "value": "$SAFE_MESSAGE"},
                   {"key": "TRIGGER_REPO", "value": "$BITBUCKET_REPO_FULL_NAME"}]